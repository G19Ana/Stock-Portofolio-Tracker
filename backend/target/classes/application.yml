spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/stock_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${ALERT_EMAIL:}
    password: ${ALERT_EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

alphavantage:
  api:
    key: ${ALPHA_VANTAGE_KEY:demo}
    url: https://www.alphavantage.co/query